<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media library — Flourish Hub Global Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<style>
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .media-tile { border: 1px solid var(--border); background: var(--surface); position: relative; }
  .media-tile .thumb { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--surface-2); }
  .media-tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .media-tile .thumb i { font-size: 1.8rem; color: var(--gray-light); }
  .media-tile .meta { padding: 0.5rem 0.6rem; font-size: 0.72rem; color: var(--gray); word-break: break-all; }
  .media-tile .del-btn { position: absolute; top: 6px; right: 6px; background: rgba(20,21,26,0.75); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Media library</h1><p class="text-muted-folio" style="margin:0;">Images, audio, video and files used across the site.</p></div>
      <div>
        <input type="file" id="upload-input" multiple style="display:none;">
        <button class="btn-folio btn-folio-primary" id="upload-btn">+ Upload files</button>
      </div>
    </div>

    <ul class="nav mb-4" style="border-bottom:1px solid var(--border);" id="type-tabs">
      <li class="nav-item"><button class="nav-link active" data-type="">All</button></li>
      <li class="nav-item"><button class="nav-link" data-type="image">Images</button></li>
      <li class="nav-item"><button class="nav-link" data-type="audio">Audio</button></li>
      <li class="nav-item"><button class="nav-link" data-type="video">Video</button></li>
      <li class="nav-item"><button class="nav-link" data-type="document">Documents</button></li>
    </ul>

    <div class="media-grid" id="media-grid"><div class="empty-state">Loading…</div></div>
    <div class="pager" id="media-pager"></div>
  </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'media';</script>
<script>
const PAGE_SIZE = 24;
let page = 1, fileType = '';

function iconFor(type) {
  return { image: 'bi-image', audio: 'bi-file-earmark-music', video: 'bi-file-earmark-play', document: 'bi-file-earmark-text', other: 'bi-file-earmark' }[type] || 'bi-file-earmark';
}

function tile(m) {
  const preview = m.file_type === 'image' ? `<img src="${m.file_url}" alt="${escapeHtml(m.alt_text || '')}">` : `<i class="bi ${iconFor(m.file_type)}"></i>`;
  return `
    <div class="media-tile">
      <button class="del-btn" onclick="removeMedia(${m.id})"><i class="bi bi-x"></i></button>
      <a href="${m.file_url}" target="_blank" class="thumb">${preview}</a>
      <div class="meta" title="${escapeHtml(m.original_file_name)}">${escapeHtml(m.original_file_name)}</div>
    </div>`;
}

async function load() {
  const host = document.getElementById('media-grid');
  host.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const { media } = await api('/admin/media' + qs({ fileType, page, pageSize: PAGE_SIZE }), { admin: true });
    host.innerHTML = media.length ? media.map(tile).join('') : '<div class="empty-state">Nothing uploaded yet.</div>';
    const pager = document.getElementById('media-pager'); pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = page <= 1; prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = media.length < PAGE_SIZE; next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { host.innerHTML = '<div class="empty-state">Could not load media.</div>'; }
}

async function removeMedia(id) {
  if (!confirm('Delete this file? Anything referencing it may break.')) return;
  try { await api(`/admin/media/${id}`, { method: 'DELETE', admin: true }); toast('Deleted'); load(); }
  catch (e) { toast(e.message || 'Could not delete', false); }
}

document.getElementById('upload-btn').addEventListener('click', () => document.getElementById('upload-input').click());
document.getElementById('upload-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  toast(`Uploading ${files.length} file(s)…`);
  for (const file of files) {
    const fd = new FormData(); fd.append('file', file);
    try { await api('/admin/media', { method: 'POST', admin: true, isForm: true, body: fd }); }
    catch (err) { toast(`Could not upload ${file.name}`, false); }
  }
  e.target.value = '';
  toast('Upload complete');
  load();
});

document.getElementById('type-tabs').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#type-tabs .nav-link').forEach((b) => b.classList.remove('active'));
  e.target.classList.add('active');
  fileType = e.target.dataset.type; page = 1; load();
});

(async function () { const admin = await initAdminPage(); if (admin) load(); })();
</script>
</body>
</html>
