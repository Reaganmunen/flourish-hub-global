<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publisher accounts — Flourish Hub Global Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Publisher accounts</h1><p class="text-muted-folio" style="margin:0;">Owner-only. Editors can manage the catalog but not other accounts.</p></div>
    </div>

    <div class="row g-4">
      <div class="col-md-7">
        <table class="table-folio">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last login</th></tr></thead>
          <tbody id="users-body"><tr><td colspan="4" class="text-muted-folio py-3">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="col-md-5">
        <div class="panel">
          <h4 style="margin-bottom:1rem;">Invite a new account</h4>
          <form id="invite-form" class="form-folio">
            <div class="mb-3"><label>Full name</label><input class="form-control" id="in-name" required></div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="in-email" required></div>
            <div class="mb-3"><label>Temporary password</label><input type="password" class="form-control" id="in-password" minlength="8" required></div>
            <div class="mb-3"><label>Role</label>
              <select class="form-select" id="in-role"><option value="editor">Editor</option><option value="owner">Owner</option></select>
            </div>
            <button class="btn-folio btn-folio-primary btn-folio-block">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'users';</script>
<script>
async function load() {
  const body = document.getElementById('users-body');
  try {
    const { admins } = await api('/admin/auth/users', { admin: true });
    body.innerHTML = admins.map((a) => `
      <tr>
        <td>${escapeHtml(a.full_name)}</td>
        <td class="text-muted-folio">${escapeHtml(a.email)}</td>
        <td style="text-transform:capitalize;">${a.role}</td>
        <td class="text-muted-folio">${a.last_login_at ? formatDate(a.last_login_at) : 'Never'}</td>
      </tr>`).join('');
  } catch (e) { body.innerHTML = `<tr><td colspan="4" class="text-muted-folio py-3">${escapeHtml(e.message || 'Could not load accounts.')}</td></tr>`; }
}

document.getElementById('invite-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/admin/auth/register', {
      method: 'POST', admin: true,
      body: {
        fullName: document.getElementById('in-name').value,
        email: document.getElementById('in-email').value,
        password: document.getElementById('in-password').value,
        role: document.getElementById('in-role').value,
      },
    });
    toast('Account created');
    document.getElementById('invite-form').reset();
    load();
  } catch (e) { toast(e.message || 'Could not create account', false); }
});

(async function () {
  const admin = await initAdminPage();
  if (!admin) return;
  if (admin.role !== 'owner') {
    document.querySelector('.admin-main').innerHTML = '<div class="empty-state">Only owners can manage publisher accounts.</div>';
    return;
  }
  load();
})();
</script>
</body>
</html>
