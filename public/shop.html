<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | FlourishHub</title>
<meta name="description" content="Books and learning resources from FlourishHub, in print and digital editions.">
<link rel="icon" href="/assets/images/logo-flourishhub.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="hero-slides" data-slides="/assets/images/legend1.jpg,/assets/images/legend2.jpg,/assets/images/legend3.jpg" aria-hidden="true"></div>
  <div class="container-folio ph-inner">
    <div class="ph-kicker"><i class="bi bi-bag-heart"></i> The shop</div>
    <h1>Shop</h1>
    <p class="text-muted-folio">Books and learning resources from FlourishHub, in print and digital editions.</p>
  </div>
</section>

<div class="container-folio" style="padding:2rem 0 5rem;">
  <div class="row">
    <div class="col-lg-3">
      <div class="filter-block">
        <h4>Search</h4>
        <input type="text" id="f-search" class="form-control" placeholder="Title or author…" style="border-radius:3px; border:1px solid var(--border-2);">
      </div>
      <div class="filter-block">
        <h4>Category</h4>
        <div id="f-categories">
          <label class="filter-check"><input type="radio" name="cat" value="" checked> All categories</label>
        </div>
      </div>
    </div>
    <div class="col-lg-9">
      <div id="shop-results" class="card-grid"><div class="empty-state">Loading books…</div></div>
      <div class="pager" id="shop-pager"></div>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'shop';</script>
<script src="/assets/js/main.js"></script>
<script>
const PLACEHOLDER_COVER = 'https://placehold.co/400x600/f0f0f3/6b6f76?text=FlourishHub';
const PAGE_SIZE = 12;
let state = { page: 1, search: '', categoryId: '' };

function bookCard(book) {
  return `
    <a href="/book.html?slug=${encodeURIComponent(book.slug)}" class="book-card">
      <div class="cover-wrap">
        <img src="${escapeHtml(book.cover_url || PLACEHOLDER_COVER)}" alt="${escapeHtml(book.title)}">
        ${book.is_digital && !book.is_physical ? '<span class="badge-folio soft">Digital</span>' : ''}
      </div>
      <h3>${escapeHtml(book.title)}</h3>
      <div class="by-line">${escapeHtml(book.book_author_name || '')}</div>
      <div class="price">${money(book.price_cents, book.currency)}</div>
    </a>`;
}

async function loadCategories() {
  try {
    const { categories } = await api('/taxonomy/categories/book', { auth: false });
    const host = document.getElementById('f-categories');
    categories.forEach((c) => {
      const label = document.createElement('label');
      label.className = 'filter-check';
      label.innerHTML = `<input type="radio" name="cat" value="${c.id}"> ${escapeHtml(c.name)}`;
      host.appendChild(label);
    });
    host.addEventListener('change', (e) => {
      if (e.target.name === 'cat') { state.categoryId = e.target.value; state.page = 1; loadBooks(); }
    });
  } catch (_) {}
}

async function loadBooks() {
  const host = document.getElementById('shop-results');
  host.innerHTML = '<div class="empty-state">Loading books…</div>';
  try {
    const { books } = await api('/books' + qs({
      search: state.search, categoryId: state.categoryId, page: state.page, pageSize: PAGE_SIZE,
    }), { auth: false });
    host.innerHTML = books.length ? books.map(bookCard).join('') : '<div class="empty-state">No books match your filters.</div>';
    renderPager(books.length);
  } catch (e) {
    host.innerHTML = '<div class="empty-state">Could not load the shop right now.</div>';
  }
}

function renderPager(resultCount) {
  const pager = document.getElementById('shop-pager');
  pager.innerHTML = '';
  const prev = document.createElement('button');
  prev.textContent = '← Previous';
  prev.disabled = state.page <= 1;
  prev.onclick = () => { state.page--; loadBooks(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const next = document.createElement('button');
  next.textContent = 'Next →';
  next.disabled = resultCount < PAGE_SIZE;
  next.onclick = () => { state.page++; loadBooks(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const label = document.createElement('button');
  label.textContent = `Page ${state.page}`;
  label.disabled = true;
  label.classList.add('active');
  pager.append(prev, label, next);
}

let searchTimer;
document.getElementById('f-search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value; state.page = 1; loadBooks(); }, 350);
});

loadCategories();
loadBooks();
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
