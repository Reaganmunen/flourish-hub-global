<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account | FlourishHub</title>
<link rel="icon" href="/assets/images/logo-flourishhub.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<div class="container-folio" style="padding:3rem 0 5rem;" id="account-root">
  <div class="empty-state">Loading your account…</div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script>
async function init() {
  const customer = AUTH.getCustomer();
  const root = document.getElementById('account-root');
  if (!customer || !AUTH.getCustomerToken()) {
    root.innerHTML = '<div class="empty-state">You need to <a href="/login.html">log in</a> to view your account.</div>';
    return;
  }

  root.innerHTML = `
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <h1 style="font-size:2rem;">Hello, ${escapeHtml((customer.fullName || customer.email || '').split(' ')[0])}</h1>
        <p class="text-muted-folio">${escapeHtml(customer.email)}</p>
      </div>
      <button class="btn-folio btn-folio-outline" id="logout-btn">Log out</button>
    </div>
    <h3 style="margin-top:2.5rem;">Order history</h3>
    <div id="orders-list" class="mt-3"></div>`;

  document.getElementById('logout-btn').addEventListener('click', () => {
    AUTH.logoutCustomer();
    window.location.href = '/index.html';
  });

  try {
    const { orders } = await api('/orders/mine');
    const host = document.getElementById('orders-list');
    host.innerHTML = orders.length ? `
      <table class="table-folio">
        <thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th></tr></thead>
        <tbody>${orders.map((o) => `
          <tr>
            <td><a href="/order-lookup.html">${escapeHtml(o.order_number)}</a></td>
            <td>${formatDate(o.created_at)}</td>
            <td><span class="status-pill status-${o.status}">${o.status}</span></td>
            <td>${money(o.total_cents, o.currency)}</td>
          </tr>`).join('')}</tbody>
      </table>` : '<div class="empty-state">No orders yet. <a href="/shop.html">Start shopping</a></div>';
  } catch (e) {
    document.getElementById('orders-list').innerHTML = '<div class="empty-state">Could not load your orders.</div>';
  }
}
init();
</script>
</body>
</html>
