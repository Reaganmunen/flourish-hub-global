<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | FlourishHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Gallery</h1>
        <p class="text-muted-folio" style="margin:0;">Upload photos and videos from rallies, outreach events and partner activities. They appear on the public Gallery page and on the home page.</p>
      </div>
    </div>

    <div class="panel mb-4">
      <h4 style="margin-bottom:1rem;">Add to the gallery</h4>
      <div class="row g-3 form-folio">
        <div class="col-md-5">
          <label for="up-album">Album or event name</label>
          <input class="form-control" id="up-album" list="album-list" placeholder="e.g. Women's rally, Nairobi" maxlength="150">
          <datalist id="album-list"></datalist>
        </div>
        <div class="col-md-3">
          <label for="up-date">Event date</label>
          <input type="date" class="form-control" id="up-date">
        </div>
        <div class="col-md-4">
          <label for="up-status">Visibility</label>
          <select class="form-select" id="up-status">
            <option value="published">Publish now</option>
            <option value="draft">Save as draft</option>
          </select>
        </div>
        <div class="col-12">
          <label for="up-caption">Caption <span class="form-text-muted">(optional, applied to every file in this upload)</span></label>
          <input class="form-control" id="up-caption" maxlength="300">
        </div>
        <div class="col-12">
          <div class="upload-drop" id="drop">
            <i class="bi bi-cloud-arrow-up" style="font-size:1.8rem; color:var(--blue);"></i>
            <p style="margin:0.4rem 0 0.8rem;">Drag photos or videos here, or choose files</p>
            <input type="file" id="up-files" accept="image/*,video/*" multiple style="display:none;">
            <button type="button" class="btn-folio btn-folio-primary" id="pick-btn">Choose files</button>
            <div id="up-status-text" class="text-muted-folio mt-2" style="font-size:0.88rem;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 style="margin:0;">All items</h4>
      <select class="form-select" id="filter-album" style="width:auto; min-width:220px;"><option value="">All albums</option></select>
    </div>
    <div class="admin-gallery-grid" id="grid"><div class="empty-state" style="grid-column:1/-1;">Loading...</div></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Edit gallery item</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body form-folio">
      <input type="hidden" id="ed-id">
      <div class="mb-3"><label for="ed-title">Title</label><input class="form-control" id="ed-title" maxlength="150"></div>
      <div class="mb-3"><label for="ed-caption">Caption</label><textarea class="form-control" id="ed-caption" style="min-height:90px;" maxlength="300"></textarea></div>
      <div class="row">
        <div class="col-md-7 mb-3"><label for="ed-album">Album or event</label><input class="form-control" id="ed-album" list="album-list" maxlength="150"></div>
        <div class="col-md-5 mb-3"><label for="ed-date">Event date</label><input type="date" class="form-control" id="ed-date"></div>
      </div>
      <div class="row">
        <div class="col-md-7 mb-3"><label for="ed-status">Visibility</label><select class="form-select" id="ed-status"><option value="published">Published</option><option value="draft">Draft</option></select></div>
        <div class="col-md-5 mb-3"><label for="ed-order">Sort order</label><input type="number" class="form-control" id="ed-order" value="0"><div class="form-text-muted">Higher numbers show first.</div></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-folio btn-folio-outline" data-bs-dismiss="modal">Cancel</button><button class="btn-folio btn-folio-primary" id="ed-save">Save changes</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'gallery';</script>
<script>
const PAGE_SIZE = 30;
let page = 1, filterAlbum = '', rows = [];
const modal = new bootstrap.Modal(document.getElementById('edit-modal'));

function tile(x, i) {
  const thumb = x.file_type === 'video'
    ? `<video src="${escapeHtml(x.file_url)}" muted preload="metadata"></video>`
    : `<img src="${escapeHtml(x.file_url)}" alt="${escapeHtml(x.alt_text || '')}" loading="lazy">`;
  return `
    <div class="ag-tile">
      <div class="thumb">${thumb}</div>
      <div class="meta">
        <strong>${escapeHtml(x.title || x.caption || 'Untitled')}</strong>
        ${escapeHtml(x.album || 'No album')}${x.event_date ? ' &middot; ' + formatDate(x.event_date) : ''}
      </div>
      <div class="actions">
        <span class="status-pill status-${x.status}">${x.status}</span>
        <span>
          <button class="btn-folio btn-folio-ghost" title="Edit" aria-label="Edit" onclick="openEdit(${i})"><i class="bi bi-pencil"></i></button>
          <button class="btn-folio btn-folio-ghost" title="Delete" aria-label="Delete" onclick="removeItem(${x.id})"><i class="bi bi-trash3"></i></button>
        </span>
      </div>
    </div>`;
}

async function load() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Loading...</div>';
  try {
    const res = await api('/gallery/manage' + qs({ album: filterAlbum, page, pageSize: PAGE_SIZE }), { admin: true });
    rows = res.items;
    grid.innerHTML = rows.length ? rows.map(tile).join('') : '<div class="empty-state" style="grid-column:1/-1;">Nothing here yet. Add your first photos above.</div>';

    const names = res.albums.map((a) => a.album);
    document.getElementById('album-list').innerHTML = names.map((n) => `<option value="${escapeHtml(n)}">`).join('');
    const sel = document.getElementById('filter-album');
    sel.innerHTML = '<option value="">All albums</option>' + names.map((n) => `<option value="${escapeHtml(n)}" ${n === filterAlbum ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');

    const pager = document.getElementById('pager'); pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '\u2190 Previous'; prev.disabled = page <= 1; prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next \u2192'; next.disabled = rows.length < PAGE_SIZE; next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Could not load the gallery. Has the gallery migration been run?</div>';
  }
}

function dateValue(d) { return d ? String(d).slice(0, 10) : ''; }

function openEdit(i) {
  const x = rows[i];
  document.getElementById('ed-id').value = x.id;
  document.getElementById('ed-title').value = x.title || '';
  document.getElementById('ed-caption').value = x.caption || '';
  document.getElementById('ed-album').value = x.album || '';
  document.getElementById('ed-date').value = dateValue(x.event_date);
  document.getElementById('ed-status').value = x.status;
  document.getElementById('ed-order').value = x.sort_order || 0;
  modal.show();
}

document.getElementById('ed-save').addEventListener('click', async () => {
  const id = document.getElementById('ed-id').value;
  try {
    await api(`/gallery/${id}`, { method: 'PUT', admin: true, body: {
      title: document.getElementById('ed-title').value,
      caption: document.getElementById('ed-caption').value,
      album: document.getElementById('ed-album').value.trim(),
      eventDate: document.getElementById('ed-date').value,
      status: document.getElementById('ed-status').value,
      sortOrder: Number(document.getElementById('ed-order').value) || 0,
    } });
    modal.hide(); toast('Saved'); load();
  } catch (e) { toast(e.message || 'Could not save', false); }
});

async function removeItem(id) {
  if (!confirm('Remove this item from the gallery? The file stays in the media library.')) return;
  try { await api(`/gallery/${id}`, { method: 'DELETE', admin: true }); toast('Removed'); load(); }
  catch (e) { toast(e.message || 'Could not remove', false); }
}

/* uploading: each file goes to the media library, then becomes a gallery item */
async function uploadFiles(files) {
  files = Array.from(files).filter((f) => /^(image|video)\//.test(f.type));
  const status = document.getElementById('up-status-text');
  if (!files.length) { toast('Please choose photos or videos', false); return; }
  const meta = {
    album: document.getElementById('up-album').value.trim(),
    eventDate: document.getElementById('up-date').value,
    status: document.getElementById('up-status').value,
    caption: document.getElementById('up-caption').value.trim(),
  };
  let done = 0, failed = 0;
  for (const file of files) {
    status.textContent = `Uploading ${done + failed + 1} of ${files.length}...`;
    try {
      const fd = new FormData(); fd.append('file', file);
      const { media } = await api('/admin/media', { method: 'POST', admin: true, isForm: true, body: fd });
      await api('/gallery', { method: 'POST', admin: true, body: { mediaId: media.id, ...meta } });
      done++;
    } catch (err) { failed++; toast(`Could not upload ${file.name}: ${err.message || 'error'}`, false); }
  }
  status.textContent = `${done} uploaded${failed ? `, ${failed} failed` : ''}.`;
  document.getElementById('up-files').value = '';
  if (done) { toast(`${done} item(s) added to the gallery`); page = 1; load(); }
}

const drop = document.getElementById('drop'), input = document.getElementById('up-files');
document.getElementById('pick-btn').addEventListener('click', () => input.click());
input.addEventListener('change', () => uploadFiles(input.files));
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (e) => uploadFiles(e.dataTransfer.files));
document.getElementById('filter-album').addEventListener('change', (e) => { filterAlbum = e.target.value; page = 1; load(); });

(async function () { const admin = await initAdminPage(); if (admin) load(); })();
</script>
</body>
</html>
