<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles | Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="page-hero">
  <div class="hero-slides" data-slides="/assets/images/legend3.jpg,/assets/images/legend4.jpg,/assets/images/legend1.jpg" aria-hidden="true"></div>
  <div class="container-folio ph-inner">
    <div class="ph-kicker"><i class="bi bi-journal-richtext"></i> The Journal</div>
    <h1>The Journal</h1>
    <p class="text-muted-folio">Essays, interviews and behind-the-scenes notes from our editors, some free, some for members.</p>
  </div>
</section>
<div class="container-folio" style="padding:2rem 0 5rem; max-width:920px;">
  <div id="articles-list"></div>
  <div class="pager" id="articles-pager"></div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'articles';</script>
<script src="/assets/js/main.js"></script>
<script>
const PLACEHOLDER_WIDE = 'https://placehold.co/500x375/f0f0f3/6b6f76?text=Flourish+Hub+Global';
const PAGE_SIZE = 8;
let page = 1;

function row(post) {
  return `
    <a href="/article.html?slug=${encodeURIComponent(post.slug)}" class="content-row" style="text-decoration:none; color:inherit;">
      <div class="thumb"><img src="${post.featured_image_url || PLACEHOLDER_WIDE}" alt=""></div>
      <div>
        ${post.is_premium ? '<span class="badge-folio premium mb-2">Members</span>' : '<span class="badge-folio soft mb-2">Free</span>'}
        <h3>${escapeHtml(post.title)}</h3>
        <div class="meta">${formatDate(post.published_at || post.created_at)}</div>
        <p class="excerpt">${escapeHtml(post.excerpt || '')}</p>
      </div>
    </a>`;
}

async function load() {
  const host = document.getElementById('articles-list');
  host.innerHTML = '<div class="empty-state">Loading articles…</div>';
  try {
    const { posts } = await api('/posts' + qs({ page, pageSize: PAGE_SIZE }), { auth: false });
    host.innerHTML = posts.length ? posts.map(row).join('') : '<div class="empty-state">No articles published yet.</div>';
    const pager = document.getElementById('articles-pager');
    pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = page <= 1;
    prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = posts.length < PAGE_SIZE;
    next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { host.innerHTML = '<div class="empty-state">Could not load articles.</div>'; }
}
load();
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
