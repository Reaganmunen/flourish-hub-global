<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publisher login — Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a href="/index.html" class="brand-mark d-block text-center mb-2" style="justify-content:center;">
      <img src="/assets/images/logo-flourishhub.jpeg" alt="FlourishHub" class="brand-logo-img">
      <span>Flourish Hub Global</span>
    </a>
    <p class="text-muted-folio text-center mb-4">Publisher &amp; editor sign in</p>
    <form id="admin-login-form" class="form-folio">
      <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="ad-email" required></div>
      <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="ad-password" required></div>
      <button class="btn-folio btn-folio-primary btn-folio-block" id="ad-submit">Log in</button>
    </form>
    <p class="text-center mt-4"><a href="/index.html" style="font-size:0.85rem;">&larr; Back to the storefront</a></p>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('ad-submit');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { accessToken, admin } = await api('/admin/auth/login', {
      method: 'POST', auth: false,
      body: { email: document.getElementById('ad-email').value, password: document.getElementById('ad-password').value },
    });
    AUTH.setAdminToken(accessToken);
    AUTH.setAdmin(admin);
    window.location.href = '/admin/dashboard.html';
  } catch (err) {
    toast(err.message || 'Invalid credentials', false);
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
