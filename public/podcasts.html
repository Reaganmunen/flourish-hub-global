<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcasts | Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="page-hero">
  <div class="hero-slides" data-slides="/assets/images/legend4.jpg,/assets/images/legend2.jpg,/assets/images/legend3.jpg" aria-hidden="true"></div>
  <div class="container-folio ph-inner">
    <div class="ph-kicker"><i class="bi bi-mic-fill"></i> The podcast</div>
    <h1>Podcasts</h1>
    <p class="text-muted-folio">Conversations with authors, readings, and audio essays, audio and video, free and members-only.</p>
  </div>
</section>
<div class="container-folio" style="padding:2rem 0 5rem;">
  <ul class="nav mb-4" style="border-bottom:1px solid var(--border);" id="type-tabs">
    <li class="nav-item"><button class="nav-link active" data-type="">All</button></li>
    <li class="nav-item"><button class="nav-link" data-type="audio">Audio</button></li>
    <li class="nav-item"><button class="nav-link" data-type="video">Video</button></li>
  </ul>
  <div class="row g-4" id="podcasts-list"></div>
  <div class="pager" id="podcasts-pager"></div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'podcasts';</script>
<script src="/assets/js/main.js"></script>
<script>
const PLACEHOLDER_WIDE = 'https://placehold.co/500x375/f0f0f3/6b6f76?text=Flourish+Hub+Global';
const PAGE_SIZE = 9;
let page = 1, type = '';

function card(pod) {
  return `
    <div class="col-sm-6 col-md-4">
      <a href="/podcast.html?slug=${encodeURIComponent(pod.slug)}" class="book-card">
        <div class="cover-wrap" style="aspect-ratio:4/3;">
          <img src="${pod.thumbnail_url || PLACEHOLDER_WIDE}" alt="${escapeHtml(pod.title)}"><span class="play-chip"><i class="bi bi-${pod.type==='video'?'camera-video-fill':'headphones'}"></i></span>
          <span class="badge-folio ${pod.is_premium ? 'premium' : 'soft'}">${pod.is_premium ? 'Members' : (pod.type === 'video' ? 'Video' : 'Audio')}</span>
        </div>
        <h3>${escapeHtml(pod.title)}</h3>
        <div class="by-line">${pod.duration_seconds ? Math.round(pod.duration_seconds / 60) + ' min' : ''}</div>
      </a>
    </div>`;
}

async function load() {
  const host = document.getElementById('podcasts-list');
  host.innerHTML = '<div class="empty-state">Loading episodes…</div>';
  try {
    const { podcasts } = await api('/podcasts' + qs({ type, page, pageSize: PAGE_SIZE }), { auth: false });
    host.innerHTML = podcasts.length ? podcasts.map(card).join('') : '<div class="empty-state">No episodes yet.</div>';
    const pager = document.getElementById('podcasts-pager');
    pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = page <= 1;
    prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = podcasts.length < PAGE_SIZE;
    next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { host.innerHTML = '<div class="empty-state">Could not load podcasts.</div>'; }
}

document.getElementById('type-tabs').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#type-tabs .nav-link').forEach((b) => b.classList.remove('active'));
  e.target.classList.add('active');
  type = e.target.dataset.type; page = 1; load();
});
load();
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
