<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track an order | Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<div class="container-folio" style="padding:4rem 0 6rem; max-width:620px;">
  <div class="icon-tile"><i class="bi bi-truck"></i></div><h1 style="font-size:2rem;">Track an order</h1>
  <p class="text-muted-folio">Enter your order number and the email you used at checkout.</p>
  <form id="lookup-form" class="form-folio panel mt-4">
    <div class="mb-3"><label>Order number</label><input class="form-control" id="lk-number" placeholder="ORD-2026-000000" required></div>
    <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="lk-email" required></div>
    <button class="btn-folio btn-folio-primary btn-folio-block"><i class="bi bi-search"></i> Find my order</button>
  </form>
  <div id="lookup-result" class="mt-4"></div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('lookup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const number = document.getElementById('lk-number').value.trim();
  const email = document.getElementById('lk-email').value.trim();
  const result = document.getElementById('lookup-result');
  result.innerHTML = '<div class="empty-state">Looking up your order…</div>';
  try {
    const { order, items } = await api(`/orders/lookup/${encodeURIComponent(number)}` + qs({ email }), { auth: false });
    result.innerHTML = `
      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 style="margin:0;">${escapeHtml(order.order_number)}</h3>
          <span class="status-pill status-${order.status}">${order.status}</span>
        </div>
        <p class="text-muted-folio">Placed ${formatDate(order.created_at)} · Total ${money(order.total_cents, order.currency)}</p>
        <hr class="rule" style="margin:1rem 0;">
        ${items.map((i) => `<div class="d-flex justify-content-between" style="padding:0.5rem 0;"><span>${escapeHtml(i.title_snapshot)} × ${i.quantity}</span><strong>${money(i.line_total_cents)}</strong></div>`).join('')}
      </div>`;
  } catch (err) {
    result.innerHTML = `<div class="empty-state">${escapeHtml(err.message || 'Order not found.')}</div>`;
  }
});
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
