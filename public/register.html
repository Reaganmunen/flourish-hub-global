<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<div class="container-folio" style="max-width:420px; padding:5rem 0;">
  <h1 style="font-size:1.9rem; text-align:center;">Create your account</h1>
  <p class="text-muted-folio text-center mb-4">Faster checkout, order history, and members' content in one place.</p>
  <form id="reg-form" class="form-folio panel">
    <div class="mb-3"><label>Full name</label><input type="text" class="form-control" id="rg-name" required></div>
    <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="rg-email" required></div>
    <div class="mb-3"><label>Phone <span class="text-muted-folio">(optional)</span></label><input type="tel" class="form-control" id="rg-phone"></div>
    <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="rg-password" minlength="8" required></div>
    <button class="btn-folio btn-folio-primary btn-folio-block">Create account</button>
  </form>
  <p class="text-center mt-3 text-muted-folio">Already have an account? <a href="/login.html">Log in</a></p>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const { accessToken, customer } = await api('/customers/auth/register', {
      method: 'POST', auth: false,
      body: {
        fullName: document.getElementById('rg-name').value,
        email: document.getElementById('rg-email').value,
        phone: document.getElementById('rg-phone').value,
        password: document.getElementById('rg-password').value,
      },
    });
    AUTH.setCustomerToken(accessToken);
    AUTH.setCustomer(customer);
    window.location.href = '/account.html';
  } catch (err) { toast(err.message || 'Could not create account', false); }
});
</script>
</body>
</html>
