<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | FlourishHub</title>
<meta name="description" content="Photos and videos from FlourishHub rallies, outreach events, workshops and partner activities.">
<link rel="icon" href="/assets/images/logo-flourishhub.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="container-folio ph-inner">
    <div class="ph-kicker"><i class="bi bi-images"></i> Gallery</div>
    <h1>Our work in the field.</h1>
    <p class="text-muted-folio">Moments from our rallies, outreach events, workshops and partner activities with women, NGOs, schools and communities.</p>
  </div>
</section>

<section class="container-folio" style="padding:2.5rem 0 1rem;">
  <div class="album-chips" id="album-chips"></div>
  <div id="photo-grid" class="photo-grid"><div class="empty-state" style="column-span:all;">Loading...</div></div>
  <div class="pager" id="gallery-pager"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Gallery viewer">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
  <figure id="lb-figure"></figure>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'gallery';</script>
<script src="/assets/js/main.js"></script>
<script>
const PAGE_SIZE = 24;
let state = { album: '', page: 1 };
let items = [];
let current = -1;

function fmtDate(d) { return d ? formatDate(d) : ''; }

function tile(x, i) {
  const label = x.title || x.caption || '';
  const media = x.file_type === 'video'
    ? `<video src="${escapeHtml(x.file_url)}" muted preload="metadata" playsinline></video><span class="vid-chip"><i class="bi bi-play-fill"></i></span>`
    : `<img src="${escapeHtml(x.file_url)}" alt="${escapeHtml(x.alt_text || label || 'FlourishHub gallery photo')}" loading="lazy">`;
  return `<button type="button" class="photo-tile" data-i="${i}" aria-label="${escapeHtml(label || 'Open item')}">${media}${label ? `<span class="cap">${escapeHtml(label)}</span>` : ''}</button>`;
}

async function loadAlbums() {
  try {
    const { albums } = await api('/gallery/albums', { auth: false });
    const host = document.getElementById('album-chips');
    if (!albums.length) { host.style.display = 'none'; return; }
    host.innerHTML = `<button class="album-chip active" data-album="">All</button>` +
      albums.map((a) => `<button class="album-chip" data-album="${escapeHtml(a.album)}">${escapeHtml(a.album)}<small>${a.item_count}</small></button>`).join('');
    host.addEventListener('click', (e) => {
      const b = e.target.closest('.album-chip'); if (!b) return;
      host.querySelectorAll('.album-chip').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      state.album = b.dataset.album; state.page = 1; loadItems();
    });
  } catch (_) { document.getElementById('album-chips').style.display = 'none'; }
}

async function loadItems() {
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '<div class="empty-state" style="column-span:all;">Loading...</div>';
  try {
    const res = await api('/gallery' + qs({ album: state.album, page: state.page, pageSize: PAGE_SIZE }), { auth: false });
    items = res.items;
    grid.innerHTML = items.length
      ? items.map(tile).join('')
      : '<div class="gallery-empty" style="column-span:all;"><i class="bi bi-images"></i>Photos and videos from our rallies, outreach events and partner activities will be shared here soon.</div>';
    const pager = document.getElementById('gallery-pager');
    pager.innerHTML = '';
    if (state.page > 1 || items.length >= PAGE_SIZE) {
      const prev = document.createElement('button'); prev.textContent = '\u2190 Previous'; prev.disabled = state.page <= 1;
      prev.onclick = () => { state.page--; loadItems(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const next = document.createElement('button'); next.textContent = 'Next \u2192'; next.disabled = items.length < PAGE_SIZE;
      next.onclick = () => { state.page++; loadItems(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      pager.append(prev, next);
    }
  } catch (e) { grid.innerHTML = '<div class="empty-state" style="column-span:all;">Could not load the gallery right now.</div>'; }
}

/* lightbox */
const lb = document.getElementById('lightbox'), fig = document.getElementById('lb-figure');
function show(i) {
  if (!items.length) return;
  current = (i + items.length) % items.length;
  const x = items[current];
  const label = x.title || '';
  const sub = [x.album, fmtDate(x.event_date)].filter(Boolean).join(' · ');
  const media = x.file_type === 'video'
    ? `<video src="${escapeHtml(x.file_url)}" controls autoplay playsinline></video>`
    : `<img src="${escapeHtml(x.file_url)}" alt="${escapeHtml(x.alt_text || label || 'FlourishHub gallery photo')}">`;
  fig.innerHTML = `${media}${(label || x.caption || sub) ? `<figcaption>${escapeHtml(x.caption || label)}${sub ? `<small>${escapeHtml(sub)}</small>` : ''}</figcaption>` : ''}`;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function hide() { lb.classList.remove('open'); fig.innerHTML = ''; document.body.style.overflow = ''; }
document.getElementById('photo-grid').addEventListener('click', (e) => { const t = e.target.closest('.photo-tile'); if (t) show(Number(t.dataset.i)); });
document.getElementById('lb-close').onclick = hide;
document.getElementById('lb-prev').onclick = () => show(current - 1);
document.getElementById('lb-next').onclick = () => show(current + 1);
lb.addEventListener('click', (e) => { if (e.target === lb) hide(); });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') hide();
  if (e.key === 'ArrowLeft') show(current - 1);
  if (e.key === 'ArrowRight') show(current + 1);
});

loadAlbums();
loadItems();
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
