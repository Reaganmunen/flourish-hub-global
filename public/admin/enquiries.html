<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries | FlourishHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Enquiries</h1>
        <p class="text-muted-folio" style="margin:0;">Messages from the contact form, partnership enquiries and newsletter sign-ups.</p>
      </div>
    </div>

    <ul class="nav mb-4" style="border-bottom:1px solid var(--border);" id="source-tabs">
      <li class="nav-item"><button class="nav-link active" data-source="">All</button></li>
      <li class="nav-item"><button class="nav-link" data-source="contact">Contact</button></li>
      <li class="nav-item"><button class="nav-link" data-source="partner">Partnership</button></li>
      <li class="nav-item"><button class="nav-link" data-source="newsletter">Newsletter</button></li>
    </ul>

    <div class="table-responsive">
      <table class="table align-middle" id="enq-table">
        <thead><tr><th>Received</th><th>From</th><th>Type</th><th>Topic</th><th>Status</th><th></th></tr></thead>
        <tbody id="enq-body"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="modal fade" id="enq-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="enq-title">Enquiry</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="enq-detail"></div>
    <div class="modal-footer justify-content-between">
      <button class="btn-folio btn-folio-outline btn-folio-sm" id="enq-delete"><i class="bi bi-trash3"></i> Delete</button>
      <div class="d-flex gap-2">
        <button class="btn-folio btn-folio-outline btn-folio-sm" data-status="read">Mark as read</button>
        <button class="btn-folio btn-folio-primary btn-folio-sm" data-status="replied">Mark as replied</button>
      </div>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'enquiries';</script>
<script>
const PAGE_SIZE = 30;
let page = 1, source = '', rows = [], openId = null;
const modal = new bootstrap.Modal(document.getElementById('enq-modal'));
const SOURCE_LABEL = { contact: 'Contact', partner: 'Partnership', newsletter: 'Newsletter' };

function rowHtml(e, i) {
  return `<tr style="cursor:pointer;" onclick="openEnquiry(${i})">
    <td>${formatDate(e.created_at)}</td>
    <td><strong>${escapeHtml(e.name || e.email)}</strong><div class="text-muted-folio" style="font-size:0.82rem;">${escapeHtml(e.name ? e.email : '')}${e.organization ? ' &middot; ' + escapeHtml(e.organization) : ''}</div></td>
    <td>${SOURCE_LABEL[e.source] || escapeHtml(e.source)}</td>
    <td>${escapeHtml(e.topic || '')}</td>
    <td><span class="status-pill status-${e.status}">${e.status}</span></td>
    <td><i class="bi bi-chevron-right"></i></td>
  </tr>`;
}

async function load() {
  const body = document.getElementById('enq-body');
  try {
    const res = await api('/contact/manage' + qs({ source, page, pageSize: PAGE_SIZE }), { admin: true });
    rows = res.enquiries;
    body.innerHTML = rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="6" class="empty-state">No enquiries yet.</td></tr>';
    const pager = document.getElementById('pager'); pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '\u2190 Previous'; prev.disabled = page <= 1; prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next \u2192'; next.disabled = rows.length < PAGE_SIZE; next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { body.innerHTML = '<tr><td colspan="6" class="empty-state">Could not load enquiries. Has the enquiries migration been run?</td></tr>'; }
}

async function setStatus(id, status) {
  try { await api(`/contact/manage/${id}/status`, { method: 'PUT', admin: true, body: { status } }); load(); }
  catch (e) { toast(e.message || 'Could not update', false); }
}

function openEnquiry(i) {
  const e = rows[i];
  openId = e.id;
  document.getElementById('enq-title').textContent = `${SOURCE_LABEL[e.source] || 'Enquiry'} from ${e.name || e.email}`;
  document.getElementById('enq-detail').innerHTML = `
    <div class="row g-3 mb-3">
      <div class="col-md-6"><div class="text-muted-folio" style="font-size:0.8rem;">Email</div><a href="mailto:${escapeHtml(e.email)}">${escapeHtml(e.email)}</a></div>
      <div class="col-md-6"><div class="text-muted-folio" style="font-size:0.8rem;">Phone</div>${escapeHtml(e.phone || 'Not given')}</div>
      <div class="col-md-6"><div class="text-muted-folio" style="font-size:0.8rem;">Organization</div>${escapeHtml(e.organization || 'Not given')}</div>
      <div class="col-md-6"><div class="text-muted-folio" style="font-size:0.8rem;">Topic</div>${escapeHtml(e.topic || 'Not given')}</div>
    </div>
    <div class="text-muted-folio" style="font-size:0.8rem;">Message</div>
    <div class="panel" style="white-space:pre-wrap;">${escapeHtml(e.message || 'No message (newsletter sign-up).')}</div>
    <div class="text-muted-folio mt-3" style="font-size:0.82rem;">Received ${formatDate(e.created_at)}</div>`;
  modal.show();
  if (e.status === 'new') setStatus(e.id, 'read');
}

document.querySelectorAll('#enq-modal [data-status]').forEach((b) => b.addEventListener('click', async () => {
  await setStatus(openId, b.dataset.status); modal.hide(); toast('Updated');
}));
document.getElementById('enq-delete').addEventListener('click', async () => {
  if (!confirm('Delete this enquiry permanently?')) return;
  try { await api(`/contact/manage/${openId}`, { method: 'DELETE', admin: true }); modal.hide(); toast('Deleted'); load(); }
  catch (e) { toast(e.message || 'Could not delete', false); }
});
document.getElementById('source-tabs').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#source-tabs .nav-link').forEach((b) => b.classList.remove('active'));
  e.target.classList.add('active');
  source = e.target.dataset.source; page = 1; load();
});

(async function () { const admin = await initAdminPage(); if (admin) load(); })();
</script>
</body>
</html>
