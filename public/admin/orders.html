<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | FlourishHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Orders</h1><p class="text-muted-folio" style="margin:0;">Every checkout, guest or registered.</p></div>
      <select id="f-status" class="form-select" style="max-width:180px; border-radius:3px; border:1px solid var(--border-2);">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="fulfilled">Fulfilled</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <table class="table-folio">
      <thead><tr><th>Order</th><th>Customer</th><th>Currency</th><th>Total</th><th>Status</th><th>Placed</th><th></th></tr></thead>
      <tbody id="orders-body"><tr><td colspan="7" class="text-muted-folio py-3">Loading…</td></tr></tbody>
    </table>
    <div class="pager" id="orders-pager"></div>
  </main>
</div>

<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:6px; border-color:var(--border);">
      <div class="modal-header"><h5 class="modal-title" id="modal-order-title">Order</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modal-order-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'orders';</script>
<script>
// Turns the stored address object into readable lines for the order view.
function formatAddress(a) {
  if (!a || typeof a !== 'object') return String(a || '');
  return [a.line1, a.line2, [a.city, a.stateRegion || a.state].filter(Boolean).join(', '), a.postalCode, a.country].filter(Boolean).join('\n');
}
const PAGE_SIZE = 20;
let page = 1, status = '';

async function load() {
  const body = document.getElementById('orders-body');
  body.innerHTML = '<tr><td colspan="7" class="text-muted-folio py-3">Loading…</td></tr>';
  try {
    const { orders } = await api('/orders/manage' + qs({ status, page, pageSize: PAGE_SIZE }), { admin: true });
    body.innerHTML = orders.length ? orders.map((o) => `
      <tr>
        <td><strong>${escapeHtml(o.order_number)}</strong></td>
        <td class="text-muted-folio">${escapeHtml(o.guest_full_name || o.guest_email || 'Registered customer')}</td>
        <td class="text-muted-folio">${o.currency}</td>
        <td>${money(o.total_cents, o.currency)}</td>
        <td><span class="status-pill status-${o.status}">${o.status}</span></td>
        <td class="text-muted-folio">${formatDate(o.created_at)}</td>
        <td class="text-end"><button class="btn-folio btn-folio-outline btn-folio-sm" onclick="viewOrder(${o.id})">View</button></td>
      </tr>`).join('') : '<tr><td colspan="7" class="text-muted-folio py-3">No orders match.</td></tr>';
    const pager = document.getElementById('orders-pager'); pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = page <= 1; prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = orders.length < PAGE_SIZE; next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { body.innerHTML = '<tr><td colspan="7" class="text-muted-folio py-3">Could not load orders.</td></tr>'; }
}

async function viewOrder(id) {
  document.getElementById('modal-order-title').textContent = 'Loading…';
  document.getElementById('modal-order-body').innerHTML = '<div class="empty-state">Loading…</div>';
  const modal = new bootstrap.Modal(document.getElementById('orderModal'));
  modal.show();
  try {
    const { order, items } = await api(`/orders/manage/${id}`, { admin: true });
    document.getElementById('modal-order-title').textContent = order.order_number;
    document.getElementById('modal-order-body').innerHTML = `
      <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
        <div>
          <p class="mb-1"><strong>${escapeHtml(order.guest_full_name || 'Registered customer')}</strong></p>
          <p class="text-muted-folio mb-0">${escapeHtml(order.guest_email || '')}</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <select id="status-select" class="form-select form-select-sm">
            ${['pending', 'paid', 'fulfilled', 'cancelled'].map((s) => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          <button class="btn-folio btn-folio-primary btn-folio-sm" onclick="updateStatus(${order.id})">Update</button>
        </div>
      </div>
      <table class="table-folio">
        <thead><tr><th>Item</th><th>Type</th><th>Qty</th><th>Total</th></tr></thead>
        <tbody>${items.map((i) => `<tr><td>${escapeHtml(i.title_snapshot)}</td><td class="text-muted-folio" style="text-transform:capitalize;">${i.item_type}</td><td>${i.quantity}</td><td>${money(i.line_total_cents)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="d-flex justify-content-between mt-3"><span class="text-muted-folio">Shipping</span><span>${money(order.shipping_cents, order.currency)}</span></div>
      <div class="d-flex justify-content-between"><span class="text-muted-folio">Tax</span><span>${money(order.tax_cents, order.currency)}</span></div>
      <div class="d-flex justify-content-between mt-2"><strong>Total</strong><strong>${money(order.total_cents, order.currency)}</strong></div>
      ${order.shipping_address ? `<hr class="rule"><h6>Shipping address</h6><p class="text-muted-folio" style="white-space:pre-line;">${escapeHtml(formatAddress(order.shipping_address))}</p>` : ''}`;
  } catch (e) {
    document.getElementById('modal-order-body').innerHTML = '<div class="empty-state">Could not load this order.</div>';
  }
}

async function updateStatus(id) {
  const status = document.getElementById('status-select').value;
  try {
    await api(`/orders/manage/${id}/status`, { method: 'PUT', admin: true, body: { status } });
    toast('Order status updated');
    load();
    bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
  } catch (e) { toast(e.message || 'Could not update status', false); }
}

document.getElementById('f-status').addEventListener('change', (e) => { status = e.target.value; page = 1; load(); });
(async function () { const admin = await initAdminPage(); if (admin) load(); })();
</script>
</body>
</html>
