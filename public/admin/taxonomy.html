<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories & tags | FlourishHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Categories &amp; tags</h1><p class="text-muted-folio" style="margin:0;">Used across books, articles and podcasts.</p></div>
    </div>

    <ul class="nav mb-4" style="border-bottom:1px solid var(--border);" id="ctx-tabs">
      <li class="nav-item"><button class="nav-link active" data-ctx="book">Book categories</button></li>
      <li class="nav-item"><button class="nav-link" data-ctx="post">Article categories</button></li>
      <li class="nav-item"><button class="nav-link" data-ctx="podcast">Podcast categories</button></li>
    </ul>

    <div class="row g-4">
      <div class="col-md-6">
        <form id="cat-form" class="d-flex gap-2 mb-3">
          <input class="form-control" id="cat-name" placeholder="New category name" required>
          <button class="btn-folio btn-folio-primary btn-folio-sm">Add</button>
        </form>
        <div id="cat-list"></div>
      </div>
      <div class="col-md-6">
        <h4 style="margin-bottom:1rem;">Tags <span class="text-muted-folio" style="font-weight:400; font-size:0.85rem;">(shared across everything)</span></h4>
        <form id="tag-form" class="d-flex gap-2 mb-3">
          <input class="form-control" id="tag-name" placeholder="New tag name" required>
          <button class="btn-folio btn-folio-primary btn-folio-sm">Add</button>
        </form>
        <div id="tag-list" class="d-flex gap-2 flex-wrap"></div>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'taxonomy';</script>
<script>
let ctx = 'book';

async function loadCats() {
  const host = document.getElementById('cat-list');
  host.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const { categories } = await api(`/taxonomy/categories/${ctx}`, { admin: true });
    host.innerHTML = categories.length ? `<table class="table-folio">${categories.map((c) => `
      <tr><td>${escapeHtml(c.name)}</td><td class="text-muted-folio">${escapeHtml(c.slug)}</td>
      <td class="text-end"><button class="btn-folio btn-folio-ghost btn-folio-sm" onclick="removeCat(${c.id})"><i class="bi bi-trash text-crimson"></i></button></td></tr>`).join('')}</table>`
      : '<div class="empty-state">No categories yet.</div>';
  } catch (e) { host.innerHTML = '<div class="empty-state">Could not load categories.</div>'; }
}

async function removeCat(id) {
  if (!confirm('Delete this category?')) return;
  try { await api(`/taxonomy/categories/${id}`, { method: 'DELETE', admin: true }); toast('Deleted'); loadCats(); }
  catch (e) { toast(e.message || 'Could not delete', false); }
}

document.getElementById('cat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('cat-name').value.trim();
  if (!name) return;
  try {
    await api('/taxonomy/categories', { method: 'POST', admin: true, body: { context: ctx, name } });
    document.getElementById('cat-name').value = '';
    toast('Category added'); loadCats();
  } catch (e) { toast(e.message || 'Could not add category', false); }
});

document.getElementById('ctx-tabs').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#ctx-tabs .nav-link').forEach((b) => b.classList.remove('active'));
  e.target.classList.add('active');
  ctx = e.target.dataset.ctx; loadCats();
});

async function loadTags() {
  const host = document.getElementById('tag-list');
  host.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const { tags } = await api('/taxonomy/tags', { admin: true });
    host.innerHTML = tags.length ? tags.map((t) => `<span class="badge-folio" style="background:var(--surface-2); color:var(--ink);">${escapeHtml(t.name)}</span>`).join('') : '<div class="empty-state">No tags yet.</div>';
  } catch (e) { host.innerHTML = '<div class="empty-state">Could not load tags.</div>'; }
}

document.getElementById('tag-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('tag-name').value.trim();
  if (!name) return;
  try {
    await api('/taxonomy/tags', { method: 'POST', admin: true, body: { name } });
    document.getElementById('tag-name').value = '';
    toast('Tag added'); loadTags();
  } catch (e) { toast(e.message || 'Could not add tag', false); }
});

(async function () { const admin = await initAdminPage(); if (admin) { loadCats(); loadTags(); } })();
</script>
</body>
</html>
