<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcasts — Flourish Hub Global Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Podcasts</h1><p class="text-muted-folio" style="margin:0;">Audio &amp; video episodes.</p></div>
      <a href="/admin/podcast-form.html" class="btn-folio btn-folio-primary">+ New episode</a>
    </div>
    <table class="table-folio">
      <thead><tr><th>Title</th><th>Type</th><th>Access</th><th>Status</th><th></th></tr></thead>
      <tbody id="pod-body"><tr><td colspan="5" class="text-muted-folio py-3">Loading…</td></tr></tbody>
    </table>
    <div class="pager" id="pod-pager"></div>
  </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'podcasts';</script>
<script>
const PAGE_SIZE = 15;
let page = 1;
async function load() {
  const body = document.getElementById('pod-body');
  body.innerHTML = '<tr><td colspan="5" class="text-muted-folio py-3">Loading…</td></tr>';
  try {
    const { podcasts } = await api('/podcasts/manage' + qs({ page, pageSize: PAGE_SIZE }), { admin: true });
    body.innerHTML = podcasts.length ? podcasts.map((p) => `
      <tr>
        <td><a href="/admin/podcast-form.html?id=${p.id}" style="color:var(--ink); font-weight:600;">${escapeHtml(p.title)}</a></td>
        <td class="text-muted-folio" style="text-transform:capitalize;">${p.type}</td>
        <td>${p.is_premium ? '<span class="badge-folio premium">Members</span>' : '<span class="badge-folio soft">Free</span>'}</td>
        <td><span class="status-pill status-${p.status}">${p.status}</span></td>
        <td class="text-end">
          <a href="/admin/podcast-form.html?id=${p.id}" class="btn-folio btn-folio-ghost btn-folio-sm"><i class="bi bi-pencil"></i></a>
          <button class="btn-folio btn-folio-ghost btn-folio-sm" onclick="removePod(${p.id})"><i class="bi bi-trash text-crimson"></i></button>
        </td>
      </tr>`).join('') : '<tr><td colspan="5" class="text-muted-folio py-3">No episodes yet.</td></tr>';
    const pager = document.getElementById('pod-pager'); pager.innerHTML = '';
    const prev = document.createElement('button'); prev.textContent = '← Previous'; prev.disabled = page <= 1; prev.onclick = () => { page--; load(); };
    const next = document.createElement('button'); next.textContent = 'Next →'; next.disabled = podcasts.length < PAGE_SIZE; next.onclick = () => { page++; load(); };
    pager.append(prev, next);
  } catch (e) { body.innerHTML = '<tr><td colspan="5" class="text-muted-folio py-3">Could not load episodes.</td></tr>'; }
}
async function removePod(id) {
  if (!confirm('Delete this episode?')) return;
  try { await api(`/podcasts/${id}`, { method: 'DELETE', admin: true }); toast('Episode deleted'); load(); }
  catch (e) { toast(e.message || 'Could not delete', false); }
}
(async function () { const admin = await initAdminPage(); if (admin) load(); })();
</script>
</body>
</html>
