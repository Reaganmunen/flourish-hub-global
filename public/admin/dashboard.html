<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Flourish Hub Global Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 style="font-size:1.7rem; margin-bottom:0.2rem;">Dashboard</h1><p class="text-muted-folio" style="margin:0;">A quick look at the shop &amp; catalog.</p></div>
      <a href="/index.html" target="_blank" class="btn-folio btn-folio-outline btn-folio-sm">View storefront <i class="bi bi-box-arrow-up-right"></i></a>
    </div>

    <div class="row g-3 mb-5">
      <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="stat-books">–</div><div class="lbl">Books</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="stat-posts">–</div><div class="lbl">Articles</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="stat-podcasts">–</div><div class="lbl">Podcast episodes</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="num" id="stat-orders">–</div><div class="lbl">Orders this list</div></div></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 style="margin:0;">Recent orders</h3>
      <a href="/admin/orders.html" style="font-size:0.88rem; font-weight:600;">View all &rarr;</a>
    </div>
    <table class="table-folio">
      <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed</th></tr></thead>
      <tbody id="orders-body"><tr><td colspan="5" class="text-muted-folio py-3">Loading…</td></tr></tbody>
    </table>

    <div class="row g-3 mt-5">
      <div class="col-md-4"><a href="/admin/book-form.html" class="btn-folio btn-folio-outline btn-folio-block">+ New book</a></div>
      <div class="col-md-4"><a href="/admin/post-editor.html" class="btn-folio btn-folio-outline btn-folio-block">+ New article</a></div>
      <div class="col-md-4"><a href="/admin/podcast-form.html" class="btn-folio btn-folio-outline btn-folio-block">+ New episode</a></div>
    </div>
  </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin.js"></script>
<script>window.ACTIVE_ADMIN_NAV = 'dashboard';</script>
<script>
(async function () {
  const admin = await initAdminPage();
  if (!admin) return;

  try { const { books } = await api('/books/manage' + qs({ pageSize: 200 }), { admin: true }); document.getElementById('stat-books').textContent = books.length; } catch (_) {}
  try { const { posts } = await api('/posts/manage' + qs({ pageSize: 200 }), { admin: true }); document.getElementById('stat-posts').textContent = posts.length; } catch (_) {}
  try { const { podcasts } = await api('/podcasts/manage' + qs({ pageSize: 200 }), { admin: true }); document.getElementById('stat-podcasts').textContent = podcasts.length; } catch (_) {}

  try {
    const { orders } = await api('/orders/manage' + qs({ pageSize: 8 }), { admin: true });
    document.getElementById('stat-orders').textContent = orders.length;
    document.getElementById('orders-body').innerHTML = orders.length ? orders.map((o) => `
      <tr>
        <td><a href="/admin/orders.html">${escapeHtml(o.order_number)}</a></td>
        <td>${escapeHtml(o.guest_full_name || o.guest_email || 'Registered customer')}</td>
        <td><span class="status-pill status-${o.status}">${o.status}</span></td>
        <td>${money(o.total_cents, o.currency)}</td>
        <td>${formatDate(o.created_at)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="text-muted-folio py-3">No orders yet.</td></tr>';
  } catch (e) {
    document.getElementById('orders-body').innerHTML = '<tr><td colspan="5" class="text-muted-folio py-3">Could not load orders.</td></tr>';
  }
})();
</script>
</body>
</html>
