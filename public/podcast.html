<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Episode | FlourishHub</title>
<meta name="description" content="Listen to an episode from FlourishHub.">
<link rel="icon" href="/assets/images/logo-flourishhub.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<div id="podcast-detail" class="container-folio" style="padding:3rem 0 5rem; max-width:760px;">
  <div class="empty-state">Loading…</div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'podcasts';</script>
<script src="/assets/js/main.js"></script>
<script>
const PLACEHOLDER_WIDE = 'https://placehold.co/900x500/f0f0f3/6b6f76?text=FlourishHub';
const slug = new URLSearchParams(location.search).get('slug');
const accessToken = new URLSearchParams(location.search).get('access_token');

async function loadSlugMeta() {
  // Public podcast detail is behind loadPodcastBySlug + checkPremiumAccess middleware,
  // so we hit the same /slug/:slug route the router chain protects.
  const path = `/podcasts/slug/${encodeURIComponent(slug)}` + (accessToken ? qs({ access_token: accessToken }) : '');
  return api(path, { auth: !!AUTH.getCustomerToken() });
}

async function load() {
  const host = document.getElementById('podcast-detail');
  if (!slug) { host.innerHTML = '<div class="empty-state">No episode specified.</div>'; return; }
  try {
    const { podcast, categories } = await loadSlugMeta();
    document.getElementById('page-title').textContent = `${podcast.title} | FlourishHub`;

    const playerSrc = podcast.media_url || '';
    const playerHtml = podcast.type === 'video'
      ? `<video controls style="width:100%; border:1px solid var(--border);" poster="${escapeHtml(podcast.thumbnail_url || PLACEHOLDER_WIDE)}" ${playerSrc ? `src="${escapeHtml(playerSrc)}"` : ''}></video>`
      : `<audio controls style="width:100%;" ${playerSrc ? `src="${escapeHtml(playerSrc)}"` : ''}></audio>`;

    let player;
    if (podcast.locked) {
      player = `
        <div class="locked-panel">
          <div class="lock-icon"><i class="bi bi-lock"></i></div>
          <h3>This is a members&rsquo; episode</h3>
          <p class="text-muted-folio">${playerSrc ? 'A preview clip is available below. Unlock the full episode to hear the rest.' : 'Unlock the full episode to listen.'}</p>
          <div class="d-flex gap-3 justify-content-center mt-3">
            <button class="btn-folio btn-folio-crimson" id="buy-pod-btn">Unlock for ${money(podcast.price_cents)}</button>
            <a href="/login.html" class="btn-folio btn-folio-outline">Log in</a>
          </div>
        </div>
        ${playerSrc ? `<p class="text-muted-folio" style="font-size:0.8rem; margin:1.2rem 0 0.4rem;">Preview clip</p>${playerHtml}` : ''}`;
    } else {
      player = playerHtml;
    }

    host.innerHTML = `
      <div class="d-flex gap-2 mb-3 flex-wrap">
        ${categories.map((c) => `<span class="badge-folio soft">${escapeHtml(c.name)}</span>`).join('')}
        <span class="badge-folio ${podcast.is_premium ? 'premium' : 'soft'}">${podcast.is_premium ? 'Members' : (podcast.type === 'video' ? 'Video' : 'Audio')}</span>
      </div>
      <h1>${escapeHtml(podcast.title)}</h1>
      <p class="text-muted-folio mb-4">${podcast.duration_seconds ? Math.round(podcast.duration_seconds / 60) + ' min \u00b7 ' : ''}${formatDate(podcast.published_at)}</p>
      <img src="${escapeHtml(podcast.thumbnail_url || PLACEHOLDER_WIDE)}" alt="${escapeHtml(podcast.title)}" style="width:100%; border:1px solid var(--border); margin-bottom:1.5rem;">
      ${player}
      <p style="color:var(--ink-soft); margin-top:1.8rem; white-space:pre-line;">${escapeHtml(podcast.description || '')}</p>
      ${podcast.transcript ? `<hr class="rule"><h3>Transcript</h3><p style="color:var(--ink-soft); white-space:pre-line;">${escapeHtml(podcast.transcript)}</p>` : ''}`;

    const buyBtn = document.getElementById('buy-pod-btn');
    if (buyBtn) buyBtn.addEventListener('click', () => {
      addToCart({ itemType: 'podcast', id: podcast.id, title: podcast.title, priceCents: podcast.price_cents, image: podcast.thumbnail_url });
      window.location.href = '/cart.html';
    });
  } catch (e) {
    host.innerHTML = '<div class="empty-state">This episode could not be found.</div>';
  }
}
load();
</script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
