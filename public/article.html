<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Article — Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<style>
  .article-body { font-family: var(--font-serif); font-size: 1.15rem; line-height: 1.8; color: var(--ink-soft); }
  .article-body p { margin-bottom: 1.4rem; }
  .article-body h2, .article-body h3 { font-family: var(--font-serif); color: var(--ink); margin: 2rem 0 1rem; }
  .article-body img { width: 100%; margin: 1.5rem 0; border: 1px solid var(--border); }
  .article-body blockquote { border-left: 3px solid var(--crimson); padding-left: 1.2rem; font-style: italic; color: var(--ink); margin: 1.8rem 0; }
  .article-body ul, .article-body ol { margin-bottom: 1.4rem; padding-left: 1.4rem; }
  .article-body figcaption { font-family: var(--font-sans); font-size: 0.82rem; color: var(--gray); margin-top: -1rem; margin-bottom: 1.4rem; }
</style>
</head>
<body>
<header id="site-header" class="site-header"></header>
<div id="article-detail" class="container-folio" style="padding:3rem 0 5rem; max-width:720px;">
  <div class="empty-state">Loading…</div>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>window.ACTIVE_NAV = 'articles';</script>
<script src="/assets/js/main.js"></script>
<script>
const PLACEHOLDER_WIDE = 'https://placehold.co/900x500/f0f0f3/6b6f76?text=Flourish+Hub+Global';
const slug = new URLSearchParams(location.search).get('slug');
const accessToken = new URLSearchParams(location.search).get('access_token');

/** Render Editor.js output blocks (as produced by the admin CMS) into read-only HTML. */
function renderBlocks(blocks) {
  if (!Array.isArray(blocks) || !blocks.length) return '<p class="text-muted-folio">No content yet.</p>';
  return blocks.map((b) => {
    const d = b.data || {};
    switch (b.type) {
      case 'header': return `<h${d.level || 2}>${d.text || ''}</h${d.level || 2}>`;
      case 'paragraph': return `<p>${d.text || ''}</p>`;
      case 'quote': return `<blockquote>${d.text || ''}${d.caption ? `<footer class="text-muted-folio" style="font-style:normal; font-size:0.85rem; margin-top:0.4rem;">— ${d.caption}</footer>` : ''}</blockquote>`;
      case 'list': {
        const tag = d.style === 'ordered' ? 'ol' : 'ul';
        return `<${tag}>${(d.items || []).map((i) => `<li>${typeof i === 'string' ? i : (i.content || '')}</li>`).join('')}</${tag}>`;
      }
      case 'image': {
        const src = d.file?.url || d.url || PLACEHOLDER_WIDE;
        return `<figure><img src="${src}" alt="${d.caption || ''}">${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}</figure>`;
      }
      case 'delimiter': return `<div style="text-align:center; color:var(--gray); margin:2rem 0;">***</div>`;
      case 'table': {
        const rows = d.content || [];
        return `<table class="table-folio" style="margin:1.5rem 0;">${rows.map((r, i) => `<tr>${r.map((c) => `<t${i === 0 && d.withHeadings ? 'h' : 'd'}>${c}</t${i === 0 && d.withHeadings ? 'h' : 'd'}>`).join('')}</tr>`).join('')}</table>`;
      }
      case 'embed': return `<div class="ratio ratio-16x9" style="margin:1.5rem 0;"><iframe src="${d.embed || ''}" allowfullscreen></iframe></div>`;
      default: return '';
    }
  }).join('');
}

async function load() {
  const host = document.getElementById('article-detail');
  if (!slug) { host.innerHTML = '<div class="empty-state">No article specified.</div>'; return; }
  try {
    const path = `/posts/slug/${encodeURIComponent(slug)}` + (accessToken ? qs({ access_token: accessToken }) : '');
    const { post, categories } = await api(path, { auth: !!AUTH.getCustomerToken() });
    document.getElementById('page-title').textContent = `${post.title} — Flourish Hub Global`;

    let bodyHtml;
    if (post.locked) {
      bodyHtml = `
        <div class="article-body">${renderBlocks(post.content)}</div>
        <div class="locked-panel">
          <div class="lock-icon"><i class="bi bi-lock"></i></div>
          <h3>This is a members' article</h3>
          <p class="text-muted-folio">Purchase this piece individually, or log in if you already have access.</p>
          <div class="d-flex gap-3 justify-content-center mt-3">
            <button class="btn-folio btn-folio-crimson" id="buy-post-btn">Unlock for ${money(post.price_cents)}</button>
            <a href="/login.html" class="btn-folio btn-folio-outline">Log in</a>
          </div>
        </div>`;
    } else {
      bodyHtml = `<div class="article-body">${renderBlocks(post.content)}</div>`;
    }

    host.innerHTML = `
      <div class="d-flex gap-2 mb-3 flex-wrap">
        ${categories.map((c) => `<span class="badge-folio soft">${escapeHtml(c.name)}</span>`).join('')}
        ${post.is_premium ? '<span class="badge-folio premium">Members</span>' : ''}
      </div>
      <h1>${escapeHtml(post.title)}</h1>
      <p class="text-muted-folio mb-4">${formatDate(post.published_at || post.created_at)}</p>
      ${post.featured_image_url ? `<img src="${post.featured_image_url}" style="width:100%; border:1px solid var(--border); margin-bottom:2rem;">` : ''}
      ${bodyHtml}`;

    const buyBtn = document.getElementById('buy-post-btn');
    if (buyBtn) buyBtn.addEventListener('click', () => {
      addToCart({ itemType: 'post', id: post.id, title: post.title, priceCents: post.price_cents, image: post.featured_image_url });
      window.location.href = '/cart.html';
    });
  } catch (e) {
    host.innerHTML = '<div class="empty-state">This article could not be found.</div>';
  }
}
load();
</script>
</body>
</html>
