<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Flourish Hub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
<header id="site-header" class="site-header"></header>
<div class="container-folio" style="max-width:420px; padding:5rem 0;">
  <h1 style="font-size:1.9rem; text-align:center;">Welcome back</h1>
  <p class="text-muted-folio text-center mb-4">Log in to view your orders and members' content.</p>
  <form id="login-form" class="form-folio panel">
    <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="lg-email" required></div>
    <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="lg-password" required></div>
    <button class="btn-folio btn-folio-primary btn-folio-block">Log in</button>
  </form>
  <p class="text-center mt-3 text-muted-folio">New here? <a href="/register.html">Create an account</a></p>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const { accessToken, customer } = await api('/customers/auth/login', {
      method: 'POST', auth: false,
      body: { email: document.getElementById('lg-email').value, password: document.getElementById('lg-password').value },
    });
    AUTH.setCustomerToken(accessToken);
    AUTH.setCustomer(customer);
    window.location.href = '/account.html';
  } catch (err) { toast(err.message || 'Could not log in', false); }
});
</script>
</body>
</html>
